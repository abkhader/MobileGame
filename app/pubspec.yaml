name: echo_app
description: "Echo, a turn-based neon puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.6
  echo_core:
    path: ../packages/echo_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/story/
    - assets/audio/
